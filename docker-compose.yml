services:
  eurofurence-weather:
    build:
      context: .
      args:
        BASE_IMAGE: ${EFW_BASE_IMAGE:-python:3.12-slim}
    image: eurofurence-weather:latest
    pull_policy: build
    container_name: eurofurence-weather
    restart: unless-stopped
    ports:
      - "8000:8000"
    mem_limit: 1g
    environment:
      EFW_STATION_ID: "10147"          # Hamburg-Fuhlsbuettel
      EFW_WARNCELLS: "102000000"       # Hansestadt Hamburg
      EFW_LOCATION_NAME: "Hamburg"
      EFW_FORECAST_HOURS: "120"
      EFW_BUSY_AT: "40"
      EFW_CROWDED_AT: "80"
      TZ: "Europe/Berlin"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status == 200 else 1)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
